[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nmap-flow-analyzer"
version = "1.3.0"
description = "Offline network analysis and security investigation with human-reviewed firewall recommendations"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "defusedxml>=0.7",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=7.0",
]

[project.scripts]
nmap-flow-analyzer = "nmap_flow_analyzer.cli:main"

[tool.setuptools]
packages = ["nmap_flow_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

