name: Build v1.3.0 RC on Ubuntu

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "nmap_flow_analyzer/**"
      - "tests/**"
      - "pyproject.toml"
      - "packaging/**"
      - "scripts/build-ubuntu.sh"
      - "scripts/package-linux-portable.sh"
      - "scripts/try-build-appimage.sh"
      - "scripts/smoke-test-package.py"
      - "scripts/collect-license-inventory.py"
      - "scripts/validate-license-payload.py"
      - "LICENSE"
      - "NOTICE"
      - "THIRD_PARTY_NOTICES.md"
      - "COPYRIGHT.md"
      - "COMMERCIAL_USE.md"
      - "TRADEMARKS.md"
      - "licenses/**"
      - "requirements*.lock"
      - ".github/workflows/build-v130-ubuntu.yml"

permissions:
  contents: read

env:
  RELEASE_VERSION: 1.3.0-rc1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkout immutable Shadow Core source
        uses: actions/checkout@v4
        with:
          repository: Raven1371/shadow-core
          ref: d3f0ef978b671824d89e4cab9432807f9e0f868a
          path: shadow-core-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev pkg-config dpkg-dev curl
          python -m pip install build==1.3.0
          python -m build --wheel shadow-core-source --outdir build/shadow-core-wheel
          python -m pip install build/shadow-core-wheel/shadow_core-0.2.0.dev0-py3-none-any.whl
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -c "import shadow_core; assert shadow_core.__version__ == '0.2.0.dev0'"
      - name: Test current v1.3.0 source
        run: |
          python -m compileall -q nmap_flow_analyzer
          set +e
          python scripts/run_pytest_with_skip_report.py \
            --json build/ubuntu-skip-report.json \
            --markdown build/ubuntu-skip-report.md \
            --platform "Ubuntu 24.04" -- -q
          test_rc=$?
          set -e
          cat build/ubuntu-skip-report.md
          test "$test_rc" -eq 0
          python run_tests.py
      - name: Build portable, onefile, and DEB
        run: bash scripts/build-ubuntu.sh
      - name: Validate license payload and native attribution
        run: |
          python scripts/validate-license-payload.py build/linux-ubuntu/bundle/nmap-flow-analyzer-1.3.0-rc1-ubuntu-x64
          dpkg-deb --contents dist-linux-ubuntu/nmap-flow-analyzer-1.3.0-rc1-ubuntu-x64.deb | grep '/usr/share/doc/nmap-flow-analyzer/LICENSE'
          pyi-archive_viewer -l dist-linux-ubuntu/nmap-flow-analyzer-1.3.0-rc1-ubuntu-x64 | grep 'COMMERCIAL_USE.md'
      - name: Smoke-test portable and onefile
        run: |
          mkdir -p build/smoke-portable
          tar -xzf dist-linux-ubuntu/nmap-flow-analyzer-1.3.0-rc1-ubuntu-x64-portable.tar.gz -C build/smoke-portable
          python scripts/smoke-test-package.py \
            --command build/smoke-portable/nmap-flow-analyzer-1.3.0-rc1-ubuntu-x64/nmap-flow-analyzer \
            --examples examples --config network_config.example.yaml --expected-version 1.4.0.dev0 --require-graphviz
          python scripts/smoke-test-package.py \
            --command dist-linux-ubuntu/nmap-flow-analyzer-1.3.0-rc1-ubuntu-x64 \
            --examples examples --config network_config.example.yaml --expected-version 1.4.0.dev0 --require-graphviz
      - name: Install, test, and remove DEB
        run: |
          sudo dpkg -i dist-linux-ubuntu/nmap-flow-analyzer-1.3.0-rc1-ubuntu-x64.deb
          dpkg -L nmap-flow-analyzer | tee build/deb-file-list.txt
          python scripts/smoke-test-package.py --command /usr/bin/nmap-flow-analyzer \
            --examples examples --config network_config.example.yaml --expected-version 1.4.0.dev0 --require-graphviz
          sudo dpkg -r nmap-flow-analyzer
          test ! -e /usr/bin/nmap-flow-analyzer
      - name: Build, inspect, and test AppImage
        id: appimage
        run: |
          bash scripts/try-build-appimage.sh ubuntu
          test "$(python -c 'import json; print(json.load(open("dist-linux-ubuntu/appimage-tool-provenance.json"))["sha256"])')" = df3baf5ca5facbecfc2f3fa6713c29ab9cefa8fd8c1eac5d283b79cab33e4acb
          python scripts/validate-license-payload.py build/linux-ubuntu/AppDir/opt/nmap-flow-analyzer
          APPIMAGE_EXTRACT_AND_RUN=1 python scripts/smoke-test-package.py \
            --command dist-linux-ubuntu/nmap-flow-analyzer-1.3.0-rc1-ubuntu-x64.AppImage \
            --examples examples --config network_config.example.yaml --expected-version 1.4.0.dev0 --require-graphviz
      - uses: actions/upload-artifact@v4
        with:
          name: v130-rc1-ubuntu-x64-${{ github.run_id }}
          path: |
            dist-linux-ubuntu/*
            build/deb-file-list.txt
            dist-linux-ubuntu/*.license-inventory.json
            build/ubuntu-skip-report.*
          if-no-files-found: error
