name: Build v1.3.0 RC on Rocky Linux 9

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "nmap_flow_analyzer/**"
      - "packaging/**"
      - "scripts/build-rhel.sh"
      - "scripts/package-linux-portable.sh"
      - "scripts/try-build-appimage.sh"
      - "scripts/smoke-test-package.py"
      - "scripts/collect-license-inventory.py"
      - "scripts/validate-license-payload.py"
      - "LICENSE"
      - "NOTICE"
      - "THIRD_PARTY_NOTICES.md"
      - "COPYRIGHT.md"
      - "COMMERCIAL_USE.md"
      - "TRADEMARKS.md"
      - "licenses/**"
      - "requirements*.lock"
      - ".github/workflows/build-v130-rhel.yml"

permissions:
  contents: read

env:
  RELEASE_VERSION: 1.3.0-rc1

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: rockylinux:9
    timeout-minutes: 50
    steps:
      - name: Install system tooling
        run: |
          dnf install -y --setopt=tsflags= git python3 python3-pip graphviz gcc rpm-build rpm-sign dnf-plugins-core cpio findutils tar gzip
          # Rocky's minimal container preinstalls these with nodocs. Restore
          # their packaged license payloads before native attribution runs.
          dnf reinstall -y --setopt=tsflags= libstdc++ lz4-libs libxcb
      - uses: actions/checkout@v4
      - name: Trust checkout and install Python build dependencies
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m pip install -r requirements-dev.lock
          python3 -m pip install --no-deps -e .
      - name: Test current v1.3.0 source
        run: |
          python3 -m compileall -q nmap_flow_analyzer
          set +e
          python3 scripts/run_pytest_with_skip_report.py \
            --json build/rocky-skip-report.json \
            --markdown build/rocky-skip-report.md \
            --platform "Rocky Linux 9" -- -q
          test_rc=$?
          set -e
          cat build/rocky-skip-report.md
          test "$test_rc" -eq 0
          python3 run_tests.py
      - name: Build portable, onefile, and RPM
        run: bash scripts/build-rhel.sh
      - name: Validate license payload and native attribution
        run: |
          python3 scripts/validate-license-payload.py build/linux-rhel/bundle/nmap-flow-analyzer-1.3.0-rc1-rhel-x64
          rpm -qpl dist-linux-rhel/nmap-flow-analyzer-1.3.0-rc1-rhel-x64.rpm | grep '/usr/share/licenses/nmap-flow-analyzer/LICENSE'
          pyi-archive_viewer -l dist-linux-rhel/nmap-flow-analyzer-1.3.0-rc1-rhel-x64 | grep 'COMMERCIAL_USE.md'
      - name: Smoke-test portable and onefile
        run: |
          mkdir -p build/smoke-portable
          tar -xzf dist-linux-rhel/nmap-flow-analyzer-1.3.0-rc1-rhel-x64-portable.tar.gz -C build/smoke-portable
          python3 scripts/smoke-test-package.py \
            --command build/smoke-portable/nmap-flow-analyzer-1.3.0-rc1-rhel-x64/nmap-flow-analyzer \
            --examples examples --config network_config.example.yaml --require-graphviz
          python3 scripts/smoke-test-package.py \
            --command dist-linux-rhel/nmap-flow-analyzer-1.3.0-rc1-rhel-x64 \
            --examples examples --config network_config.example.yaml --require-graphviz
      - name: Install, test, and remove RPM
        run: |
          rpm -ivh dist-linux-rhel/nmap-flow-analyzer-1.3.0-rc1-rhel-x64.rpm
          rpm -ql nmap-flow-analyzer | tee build/rpm-file-list.txt
          python3 scripts/smoke-test-package.py --command /usr/bin/nmap-flow-analyzer \
            --examples examples --config network_config.example.yaml --require-graphviz
          rpm -e nmap-flow-analyzer
          test ! -e /usr/bin/nmap-flow-analyzer
      - name: Build, inspect, and test AppImage
        id: appimage
        run: |
          bash scripts/try-build-appimage.sh rhel
          test "$(python3 -c 'import json; print(json.load(open("dist-linux-rhel/appimage-tool-provenance.json"))["sha256"])')" = df3baf5ca5facbecfc2f3fa6713c29ab9cefa8fd8c1eac5d283b79cab33e4acb
          python3 scripts/validate-license-payload.py build/linux-rhel/AppDir/opt/nmap-flow-analyzer
          APPIMAGE_EXTRACT_AND_RUN=1 python3 scripts/smoke-test-package.py \
            --command dist-linux-rhel/nmap-flow-analyzer-1.3.0-rc1-rhel-x64.AppImage \
            --examples examples --config network_config.example.yaml --require-graphviz
      - uses: actions/upload-artifact@v4
        with:
          name: v130-rc1-rhel-x64-${{ github.run_id }}
          path: |
            dist-linux-rhel/*
            build/rpm-file-list.txt
            dist-linux-rhel/*.license-inventory.json
            build/rocky-skip-report.*
          if-no-files-found: error
