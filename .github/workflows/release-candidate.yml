name: Assemble v1.3.0 RC

on:
  workflow_dispatch:
    inputs:
      ubuntu_run_id:
        description: Successful Ubuntu package workflow run ID
        required: true
        type: string
      rhel_run_id:
        description: Successful Rocky package workflow run ID
        required: true
        type: string
      publish_prerelease:
        description: Publish the verified bundle as a GitHub prerelease
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

env:
  RELEASE_VERSION: 1.3.0-rc1

jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source and package workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          UBUNTU_RUN_ID: ${{ inputs.ubuntu_run_id }}
          RHEL_RUN_ID: ${{ inputs.rhel_run_id }}
        run: |
          set -euo pipefail
          for run_id in "$UBUNTU_RUN_ID" "$RHEL_RUN_ID"; do
            test "$(gh run view "$run_id" --json conclusion --jq .conclusion)" = success
            test "$(gh run view "$run_id" --json headSha --jq .headSha)" = "$GITHUB_SHA"
          done
          test "$(gh run view "$UBUNTU_RUN_ID" --json workflowName --jq .workflowName)" = "Build v1.3.0 RC on Ubuntu"
          test "$(gh run view "$RHEL_RUN_ID" --json workflowName --jq .workflowName)" = "Build v1.3.0 RC on Rocky Linux 9"
      - name: Download verified build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p incoming/ubuntu incoming/rhel release
          gh run download "${{ inputs.ubuntu_run_id }}" --dir incoming/ubuntu
          gh run download "${{ inputs.rhel_run_id }}" --dir incoming/rhel
          find incoming -type f \( -name 'nmap-flow-analyzer-*' -a ! -name '*.txt' \) -exec cp {} release/ \;
      - name: Create clean source archives
        run: |
          git archive --format=zip --prefix=nmap-flow-analyzer-1.3.0-rc1/ \
            -o release/nmap-flow-analyzer-1.3.0-rc1-source.zip HEAD
          git archive --format=tar.gz --prefix=nmap-flow-analyzer-1.3.0-rc1/ \
            -o release/nmap-flow-analyzer-1.3.0-rc1-source.tar.gz HEAD
      - name: Create and verify release inventory
        run: |
          mapfile -t artifacts < <(find release -maxdepth 1 -type f -name 'nmap-flow-analyzer-*' -print | sort)
          python scripts/create-checksums.py --version "$RELEASE_VERSION" --output-dir release "${artifacts[@]}"
          python scripts/verify-release.py --directory release \
            --manifest release/release-artifacts.json --version "$RELEASE_VERSION"
          cp RELEASE_NOTES.md PLATFORM_STATUS.md release/
      - uses: actions/upload-artifact@v4
        with:
          name: v130-rc1-release-candidate-${{ github.run_id }}
          path: release/*
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish_prerelease }}
    needs: assemble
    runs-on: ubuntu-24.04
    environment: prerelease
    permissions:
      actions: read
      contents: write
    steps:
      - name: Refuse non-RC source refs
        run: test "${GITHUB_REF_TYPE}" = branch
      - uses: actions/download-artifact@v4
        with:
          name: v130-rc1-release-candidate-${{ github.run_id }}
          path: release
      - name: Publish approved prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.3.0-rc1 release/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "nmap-flow-analyzer v1.3.0-rc1" \
            --notes-file release/RELEASE_NOTES.md
